<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5-сынып Математика Тесті — Жай бөлшектер мен аралас сандар</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 12% 15%, #e0e7ff 0%, #f1f5f9 45%, #e2e8f0 100%);
      color: #0f172a;
      overflow-x: hidden;
    }

    /* Тест кезінде бір экранға (100dvh) дәл сыйғызу */
    body.quiz-mode {
      height: 100dvh;
      overflow: hidden;
    }

    .app-shell {
      max-width: 900px;
      height: 100%;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    body:not(.quiz-mode) .app-shell {
      height: auto;
      min-height: 100dvh;
      justify-content: flex-start;
      padding-bottom: 32px;
    }

    /* Заманауи Glassmorphism жоғарғы панель */
    .top-bar {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      padding: 12px 18px;
      box-shadow: 0 8px 24px -6px rgba(15, 23, 42, 0.08);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .grade-pill {
      flex-shrink: 0;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 4px 10px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
    }

    .topic-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Тікелей балл индикаторы */
    .score-pill {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: #0f172a;
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      position: relative;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.16);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s ease;
    }

    .score-pill.bump-up {
      background: #059669;
      transform: scale(1.08);
    }

    .score-pill.bump-down {
      background: #dc2626;
      transform: scale(1.08);
    }

    .score-delta {
      position: absolute;
      right: 4px;
      top: -18px;
      font-size: 12px;
      font-weight: 800;
      padding: 1px 7px;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .score-delta.show-up {
      opacity: 1;
      transform: translateY(-2px);
      background: #dcfce7;
      color: #166534;
      border: 1px solid #10b981;
    }

    .score-delta.show-down {
      opacity: 1;
      transform: translateY(-2px);
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #ef4444;
    }

    /* Прогресс жолағы мен деңгей белгісі */
    .progress-strip {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .counter-badge {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      background: #f1f5f9;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
    }

    .bar-track {
      flex: 1;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .level-tag {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
    }

    .lvl-easy {
      background: #ecfdf5;
      color: #065f46;
      border-color: #a7f3d0;
    }

    .lvl-medium {
      background: #fffbeb;
      color: #92400e;
      border-color: #fde68a;
    }

    .lvl-hard {
      background: #fef2f2;
      color: #991b1b;
      border-color: #fecaca;
    }

    /* Негізгі сұрақ карточкасы */
    .quiz-card {
      flex: 1;
      min-height: 0;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: 20px 24px;
      box-shadow: 0 14px 36px -10px rgba(15, 23, 42, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .question-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .q-prompt-box {
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 76px;
    }

    .q-text {
      font-size: clamp(17px, 2.3vw, 22px);
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      line-height: 1.4;
    }

    /* Математикалық бөлшектер */
    .math-expr {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      vertical-align: middle;
    }

    .whole {
      font-weight: 800;
      font-size: 1.06em;
    }

    .frac {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.05;
      font-size: 0.84em;
      padding: 0 2px;
    }

    .frac .num {
      border-bottom: 1.8px solid currentColor;
      padding: 0 4px 2px;
    }

    .frac .den {
      padding: 2px 4px 0;
    }

    .op {
      margin: 0 3px;
      font-weight: 700;
      color: #4f46e5;
    }

    /* 2x2 жауап нұсқалары торы */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (max-width: 560px) {
      .options-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .quiz-card {
        padding: 14px 16px;
      }
      .q-prompt-box {
        padding: 12px 14px;
        min-height: 60px;
      }
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 13px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      background: #ffffff;
      color: #0f172a;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      transition: all 0.16s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: #6366f1;
      background: #f8faff;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(79, 70, 229, 0.1);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .opt-letter {
      flex-shrink: 0;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      background: #f8fafc;
      color: #334155;
      transition: all 0.16s ease;
    }

    .option-btn.correct-ans {
      border-color: #10b981;
      background: #ecfdf5;
      color: #065f46;
      box-shadow: 0 0 0 1px #10b981;
    }

    .option-btn.correct-ans .opt-letter {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
    }

    .option-btn.wrong-ans {
      border-color: #ef4444;
      background: #fef2f2;
      color: #991b1b;
      box-shadow: 0 0 0 1px #ef4444;
    }

    .option-btn.wrong-ans .opt-letter {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }

    .option-btn.dimmed {
      opacity: 0.55;
    }

    /* Ықшам лездік түсіндірме жолағы */
    .instant-feedback {
      display: none;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      font-size: 13px;
      line-height: 1.4;
      animation: slideUp 0.2s ease;
    }

    .instant-feedback.fb-correct {
      display: block;
      background: #ecfdf5;
      border-color: #6ee7b7;
      color: #065f46;
    }

    .instant-feedback.fb-wrong {
      display: block;
      background: #fef2f2;
      border-color: #fca5a5;
      color: #991b1b;
    }

    .fb-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      margin-bottom: 2px;
      gap: 8px;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Төменгі басқару батырмалары */
    .bottom-controls {
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      transition: all 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-next {
      background: #eef2ff;
      border-color: #c7d2fe;
      color: #3730a3;
    }

    .btn-next:hover:not(:disabled) {
      background: #e0e7ff;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.18);
    }

    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #1e293b, #334155);
    }

    /* Қорытынды экран */
    .result-box {
      display: none;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid #ffffff;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 14px 36px -10px rgba(15, 23, 42, 0.1);
    }

    .score-banner {
      text-align: center;
      padding: 22px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f8fafc, #eef2ff);
      border: 1px solid #e2e8f0;
      margin-bottom: 20px;
    }

    .score-big {
      font-size: 38px;
      font-weight: 800;
      color: #0f172a;
      margin: 4px 0;
    }

    .level-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    @media (max-width: 600px) {
      .level-stats {
        grid-template-columns: 1fr;
      }
    }

    .stat-card {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      background: #ffffff;
    }

    .review-item {
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      background: #ffffff;
    }

    .review-item.correct {
      border-color: #6ee7b7;
      background: #ecfdf5;
    }

    .review-item.wrong {
      border-color: #fca5a5;
      background: #fef2f2;
    }

    .review-top {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 6px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .solution-note {
      margin-top: 8px;
      font-size: 13.5px;
      background: rgba(255, 255, 255, 0.85);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(15, 23, 42, 0.08);
    }

    /* Растау модальды терезесі */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      max-width: 420px;
      width: 100%;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
    }
  </style>
</head>
<body class="quiz-mode">
  <div class="app-shell">
    <!-- Ықшам заманауи жоғарғы панель (сұрақтардың реттілік торы алынып тасталды) -->
    <header class="top-bar" id="topBar">
      <div class="top-row">
        <div class="title-group">
          <span class="grade-pill">5-СЫНЫП</span>
          <h1 class="topic-title">Жай бөлшектер мен аралас сандарды қосу және азайту</h1>
        </div>
        <div class="score-pill" id="liveScorePill" aria-live="polite">
          <span>Балл: <span id="liveScoreValue">0</span></span>
          <span class="score-delta" id="scoreDelta"></span>
        </div>
      </div>

      <div class="progress-strip">
        <span class="counter-badge" id="currentPosition">1 / 30</span>
        <div class="bar-track" aria-label="Тест барысы">
          <div class="bar-fill" id="progressBar"></div>
        </div>
        <span class="level-tag lvl-easy" id="qLevel">1-деңгей • Жеңіл</span>
      </div>
    </header>

    <!-- Негізгі бір экрандық тест карточкасы -->
    <main class="quiz-card" id="quizCard">
      <div class="question-stage">
        <div class="q-prompt-box">
          <div class="q-text" id="qText"></div>
        </div>

        <div class="options-grid" id="qOptions"></div>

        <div class="instant-feedback" id="instantFeedback" aria-live="polite"></div>
      </div>

      <div class="bottom-controls">
        <button class="btn" id="prevBtn" type="button">← Алдыңғы</button>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-next" id="nextBtn" type="button">Келесі →</button>
          <button class="btn btn-primary" id="finishBtn" type="button">Аяқтау</button>
        </div>
      </div>
    </main>

    <!-- Қорытынды нәтиже экраны -->
    <section class="result-box" id="resultSection">
      <div class="score-banner">
        <div style="font-size: 12px; color: #64748b; font-weight: 700; letter-spacing: 0.05em;">ТЕСТ ҚОРЫТЫНДЫСЫ</div>
        <div class="score-big" id="scoreText">0 балл</div>
        <div id="accuracyText" style="font-size: 14px; color: #475569; font-weight: 600; margin-bottom: 6px;"></div>
        <div id="gradeText" style="font-size: 15px; font-weight: 700; color: #1e293b;"></div>
      </div>

      <div class="level-stats">
        <div class="stat-card">
          <div style="font-size: 11px; color: #64748b; font-weight: 700;">ЖЕҢІЛ (1–10)</div>
          <div id="statEasy" style="font-size: 20px; font-weight: 800; margin-top: 4px; color: #059669;">0 / 10</div>
        </div>
        <div class="stat-card">
          <div style="font-size: 11px; color: #64748b; font-weight: 700;">ОРТАША (11–20)</div>
          <div id="statMedium" style="font-size: 20px; font-weight: 800; margin-top: 4px; color: #d97706;">0 / 10</div>
        </div>
        <div class="stat-card">
          <div style="font-size: 11px; color: #64748b; font-weight: 700;">КҮРДЕЛІ (21–30)</div>
          <div id="statHard" style="font-size: 20px; font-weight: 800; margin-top: 4px; color: #dc2626;">0 / 10</div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px;">
        <h2 style="margin: 0; font-size: 17px; font-weight: 800;">Қатемен жұмыс және түсіндірме</h2>
        <button class="btn btn-primary" id="restartBtn" type="button">Қайта бастау</button>
      </div>
      <div id="reviewList"></div>
    </section>
  </div>

  <!-- Белгіленбеген сұрақтар ескерту терезесі -->
  <div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <h3 id="modalTitle" style="margin: 0 0 8px; font-size: 18px; font-weight: 800;">Тестті аяқтау керек пе?</h3>
      <p id="modalMessage" style="margin: 0 0 18px; color: #475569; font-size: 14px;"></p>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn" id="cancelFinishBtn" type="button">Жалғастыру</button>
        <button class="btn btn-primary" id="confirmFinishBtn" type="button">Иә, аяқтау</button>
      </div>
    </div>
  </div>

  <script>
    // Жай бөлшектерді (алым/бөлім) HTML түрінде форматтайтын көмекші функция
    function f(num, den) {
      return `<span class="frac"><span class="num">${num}</span><span class="den">${den}</span></span>`;
    }

    // Аралас санды (бүтін бөлік + жай бөлшек) HTML түрінде форматтайтын функция
    function m(whole, num, den) {
      return `<span class="math-expr"><span class="whole">${whole}</span>${f(num, den)}</span>`;
    }

    // Математикалық өрнек контейнері
    function expr(html) {
      return `<span class="math-expr">${html}</span>`;
    }

    // 30 сұрақ: 1–10 (Жеңіл), 11–20 (Орташа), 21–30 (Күрделі)
    const questions = [
      // ================= 1–10: ЖЕҢІЛ ДЕҢГЕЙ =================
      {
        id: 1,
        level: "easy",
        levelLabel: "1-деңгей • Жеңіл",
        prompt: expr(`${f(2, 7)} <span class="op">+</span> ${f(3, 7)} = ?`),
        options: [expr(f(5, 7)), expr(f(5, 14)), expr(f(6, 7)), expr(f(1, 7))],
        correct: 0,
        explanation: "Бөлімдері бірдей (7): алымдарын қосамыз — 2 + 3 = 5, бөлімі 7 күйінде қалады: 5/7."
      },
      {
        id: 2,
        level: "easy",
        levelLabel: "1-деңгей • Жеңіл",
        prompt: expr(`${f(8, 9)} <span class="op">-</span> ${f(5, 9)} = ?`),
        options: [expr(f(13, 9)), expr(f(3, 9)), expr(f(3, 18)), expr(f(4, 9))],
        correct: 1,
        explanation: "Бөлімдері бірдей (9): алымдарын азайтамыз — 8 - 5 = 3, жауабы 3/9."
      },
      {
        id: 3,
        level: "easy",
        levelLabel: "1-деңгей • Жеңіл",
        prompt: expr(`${f(1, 5)} <span class="op">+</span> ${f(3, 5)} <span class="op">+</span> ${f(1, 5)} = ?`),
        options: [expr(f(5, 15)), expr(`<span class="whole">1</span>`), expr(f(4, 5)), expr(f(6, 5))],
        correct: 1,
        explanation: "Алымдарын қосамыз: 1 + 3 + 1 = 5. Сонда 5/5 = 1 бүтін шығады."
      },
      {

    let currentIndex = 0;
    let totalScore = 0;
    let deltaTimer = null;
    const userAnswers = Array(questions.length).fill(null);
    const letters = ["A", "B", "C", "D"];

    // DOM элементтері
    const qLevelEl = document.getElementById("qLevel");
    const qTextEl = document.getElementById("qText");
    const qOptionsEl = document.getElementById("qOptions");
    const instantFeedbackEl = document.getElementById("instantFeedback");
    const liveScorePillEl = document.getElementById("liveScorePill");
    const liveScoreValueEl = document.getElementById("liveScoreValue");
    const scoreDeltaEl = document.getElementById("scoreDelta");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const finishBtn = document.getElementById("finishBtn");
    const currentPositionEl = document.getElementById("currentPosition");
    const progressBarEl = document.getElementById("progressBar");
    const quizCardEl = document.getElementById("quizCard");
    const resultSectionEl = document.getElementById("resultSection");

    // Растау модальды терезе элементтері
    const confirmModalEl = document.getElementById("confirmModal");
    const modalMessageEl = document.getElementById("modalMessage");
    const cancelFinishBtn = document.getElementById("cancelFinishBtn");
    const confirmFinishBtn = document.getElementById("confirmFinishBtn");

    // Баллды жаңарту және +1 / -1 анимациясын көрсету
    function updateScoreDisplay(delta) {
      liveScoreValueEl.textContent = totalScore;
      if (delta === undefined || delta === 0) return;

      if (deltaTimer) clearTimeout(deltaTimer);

      liveScorePillEl.classList.remove("bump-up", "bump-down");
      scoreDeltaEl.classList.remove("show-up", "show-down");

      if (delta > 0) {
        scoreDeltaEl.textContent = `+${delta}`;
        liveScorePillEl.classList.add("bump-up");
        scoreDeltaEl.classList.add("show-up");
      } else {
        scoreDeltaEl.textContent = `${delta}`;
        liveScorePillEl.classList.add("bump-down");
        scoreDeltaEl.classList.add("show-down");
      }

      deltaTimer = setTimeout(() => {
        liveScorePillEl.classList.remove("bump-up", "bump-down");
        scoreDeltaEl.classList.remove("show-up", "show-down");
      }, 900);
    }

    // Прогресс жолағы мен ағымдағы сұрақ есептегішін жаңарту
    function updateProgress() {
      const answeredCount = userAnswers.filter((a) => a !== null).length;
      currentPositionEl.textContent = `${currentIndex + 1} / ${questions.length}`;
      progressBarEl.style.width = `${(answeredCount / questions.length) * 100}%`;
    }

    // Ағымдағы сұрақты және 4 жауап нұсқасын көрсету
    function renderQuestion() {
      try {
        const q = questions[currentIndex];
        const chosen = userAnswers[currentIndex];
        const isAnswered = chosen !== null;

        qLevelEl.textContent = q.levelLabel;
        qLevelEl.className =
          "level-tag " +
          (q.level === "easy" ? "lvl-easy" : q.level === "medium" ? "lvl-medium" : "lvl-hard");

        qTextEl.innerHTML = q.prompt;
        qOptionsEl.innerHTML = "";

        q.options.forEach((optHtml, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "option-btn";

          if (isAnswered) {
            btn.disabled = true;
            if (idx === q.correct) {
              btn.classList.add("correct-ans");
            } else if (idx === chosen) {
              btn.classList.add("wrong-ans");
            } else {
              btn.classList.add("dimmed");
            }
          }

          btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span class="math-expr">${optHtml}</span>`;

          if (!isAnswered) {
            btn.addEventListener("click", () => {
              userAnswers[currentIndex] = idx;
              const delta = idx === q.correct ? 1 : -1;
              totalScore += delta;
              updateScoreDisplay(delta);
              renderQuestion();
              updateProgress();
            });
          }

          qOptionsEl.appendChild(btn);
        });

        // Жауап берілген болса, ықшам лездік түсіндірмені көрсету
        if (isAnswered) {
          const isCorrect = chosen === q.correct;
          instantFeedbackEl.className = `instant-feedback ${isCorrect ? "fb-correct" : "fb-wrong"}`;
          instantFeedbackEl.innerHTML = `
            <div class="fb-top">
              <span>${isCorrect ? "✓ Дұрыс! (+1 балл)" : "✕ Қате! (-1 балл)"}</span>
              <span>Дұрыс нұсқа: ${letters[q.correct]}</span>
            </div>
            <div><strong>Шешуі:</strong> ${q.explanation}</div>
          `;
        } else {
          instantFeedbackEl.className = "instant-feedback";
          instantFeedbackEl.innerHTML = "";
        }

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === questions.length - 1;
        updateProgress();
      } catch (err) {
        qTextEl.textContent = "Сұрақты жүктеу кезінде қате пайда болды.";
        console.error(err);
      }
    }

    // Қорытынды нәтижені, деңгейлік статистиканы және қатемен жұмысты көрсету
    function showResults() {
      try {
        let totalCorrect = 0;
        let totalWrong = 0;
        let easyCorrect = 0;
        let mediumCorrect = 0;
        let hardCorrect = 0;

        const reviewListEl = document.getElementById("reviewList");
        reviewListEl.innerHTML = "";

        questions.forEach((q, idx) => {
          const chosen = userAnswers[idx];
          const isCorrect = chosen === q.correct;

          if (isCorrect) {
            totalCorrect++;
            if (q.level === "easy") easyCorrect++;
            if (q.level === "medium") mediumCorrect++;
            if (q.level === "hard") hardCorrect++;
          } else if (chosen !== null) {
            totalWrong++;
          }

          const item = document.createElement("div");
          item.className = `review-item ${isCorrect ? "correct" : "wrong"}`;

          const chosenText =
            chosen !== null ? `${letters[chosen]}. ${q.options[chosen]}` : "Белгіленбеген (0 балл)";
          const correctText = `${letters[q.correct]}. ${q.options[q.correct]}`;
          const pointTag = chosen === null ? "0 балл" : isCorrect ? "+1 балл" : "-1 балл";

          item.innerHTML = `
            <div class="review-top">
              <span>${q.id}-сұрақ (${q.levelLabel})</span>
              <span>${isCorrect ? "✓ Дұрыс" : "✕ Қате"} (${pointTag})</span>
            </div>
            <div style="margin-bottom: 6px; font-weight: 700;">${q.prompt}</div>
            <div style="font-size: 13.5px;">
              <strong>Сіздің жауабыңыз:</strong> <span class="math-expr">${chosenText}</span><br />
              <strong>Дұрыс жауап:</strong> <span class="math-expr">${correctText}</span>
            </div>
            <div class="solution-note"><strong>Шешуі:</strong> ${q.explanation}</div>
          `;
          reviewListEl.appendChild(item);
        });

        document.getElementById("scoreText").textContent = `${totalScore} балл`;
        document.getElementById("accuracyText").textContent =
          `Дұрыс: ${totalCorrect} (+${totalCorrect})  •  Қате: ${totalWrong} (-${totalWrong})  •  Барлығы: ${questions.length}`;
        document.getElementById("statEasy").textContent = `${easyCorrect} / 10`;
        document.getElementById("statMedium").textContent = `${mediumCorrect} / 10`;
        document.getElementById("statHard").textContent = `${hardCorrect} / 10`;

        const pct = (totalCorrect / questions.length) * 100;
        let grade = "";
        if (pct >= 85) grade = "Тамаша нәтиже! Тақырыпты өте жақсы меңгергенсіз.";
        else if (pct >= 65) grade = "Жақсы нәтиже! Кейбір есептерді қайталап бекітуге болады.";
        else if (pct >= 45) grade = "Қанағаттанарлық. Ортақ бөлім келтіру мен бүтін бөлік алуды пысықтаңыз.";
        else grade = "Бастапқы деңгей. Жеңіл есептерден бастап қайталап көріңіз.";

        document.getElementById("gradeText").textContent = grade;

        document.body.classList.remove("quiz-mode");
        quizCardEl.style.display = "none";
        resultSectionEl.style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      } catch (err) {
        console.error("Нәтижені есептеу қатесі:", err);
      }
    }

    function openConfirmModal(unansweredCount) {
      modalMessageEl.textContent = `Әлі ${unansweredCount} сұрақ белгіленбеген. Тестті қазір аяқтағыңыз келе ме?`;
      confirmModalEl.classList.add("active");
    }

    function closeConfirmModal() {
      confirmModalEl.classList.remove("active");
    }

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < questions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    });

    finishBtn.addEventListener("click", () => {
      const unanswered = userAnswers.filter((a) => a === null).length;
      if (unanswered > 0) {
        openConfirmModal(unanswered);
        return;
      }
      showResults();
    });

    cancelFinishBtn.addEventListener("click", closeConfirmModal);

    confirmFinishBtn.addEventListener("click", () => {
      closeConfirmModal();
      showResults();
    });

    confirmModalEl.addEventListener("click", (e) => {
      if (e.target === confirmModalEl) {
        closeConfirmModal();
      }
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      for (let i = 0; i < userAnswers.length; i++) {
        userAnswers[i] = null;
      }
      totalScore = 0;
      currentIndex = 0;
      updateScoreDisplay(0);
      document.body.classList.add("quiz-mode");
      resultSectionEl.style.display = "none";
      quizCardEl.style.display = "flex";
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    // Бастапқы іске қосу
    renderQuestion();
  </script>
</body>
</html>
